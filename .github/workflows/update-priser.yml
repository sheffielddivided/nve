name: Oppdater strømpriser

on:
  schedule:
    # Day-ahead-prisene for neste døgn publiseres rundt kl. 13 norsk tid.
    # Kjører daglig etter dette, slik at inneværende uke er oppdatert.
    - cron: '43 13 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Hent hele historikken på nytt (fra 2015)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oppdater-priser
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Hent priser fra ENTSO-E
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python3 scripts/hent_priser.py ${{ inputs.full && '--full' || '' }}

      - name: Hent utvekslingsflyt fra ENTSO-E
        if: success() || failure()
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python3 scripts/hent_flyt.py ${{ inputs.full && '--full' || '' }}

      # Flyt og commit kjører også om et tidligere hentesteg feilet, slik at det
      # som lyktes ikke går tapt. Skriptene skriver bare fila når hentingen lyktes.
      - name: Commit og push hvis dataene er endret
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json docs/flows.json 2>/dev/null || git add docs/prices.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i dataene."
            exit 0
          fi
          git commit -m "Oppdater strømpriser og utvekslingsflyt $(date -u +%Y-%m-%d)"
          # Magasin-workflowen kan ha pushet i mellomtiden
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
